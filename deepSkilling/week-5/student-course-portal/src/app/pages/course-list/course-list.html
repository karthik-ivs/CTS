<div class="course-list-container">

  <h1>Available Courses</h1>

  <!-- @if: Display enrollment message only when a course is selected -->

  @if (enrolledCourseId) {

    <div class="success-message">
      Successfully enrolled in course ID:
      <strong>{{ enrolledCourseId }}</strong>
    </div>

  }

  <!-- @if: Display message when there are no courses -->

  @if (courses.length === 0) {

    <div class="empty-message">
      No courses are currently available.
    </div>

  }

  <!-- @for: Display each course dynamically -->

  @if (courses.length > 0) {

    <div class="courses">

      @for (course of courses; track course.id) {

        <app-course-card
          [course]="course"
          (enrollRequested)="onEnroll($event)">
        </app-course-card>

      }

    </div>

  }

</div>
