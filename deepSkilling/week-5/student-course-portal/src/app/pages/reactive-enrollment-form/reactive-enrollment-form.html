<section class="reactive-form">
  <h1>Reactive Enrollment Request</h1>

  <form [formGroup]="enrollForm" (ngSubmit)="onSubmit()" novalidate>
    <label for="reactive-student-name">Student name</label>
    <input id="reactive-student-name" type="text" formControlName="studentName" />
    <span *ngIf="enrollForm.get('studentName')?.touched && enrollForm.get('studentName')?.errors?.['required']">
      Name is required.
    </span>
    <span *ngIf="enrollForm.get('studentName')?.touched && enrollForm.get('studentName')?.errors?.['minlength']">
      Name must be at least 3 characters.
    </span>

    <label for="reactive-student-email">Student email</label>
    <input id="reactive-student-email" type="email" formControlName="studentEmail" />
    <span *ngIf="enrollForm.get('studentEmail')?.touched && enrollForm.get('studentEmail')?.errors?.['required']">
      Email is required.
    </span>
    <span *ngIf="enrollForm.get('studentEmail')?.errors?.['email']">Enter a valid email address.</span>
    <span *ngIf="enrollForm.get('studentEmail')?.errors?.['emailTaken']">Email taken.</span>

    <label for="reactive-course-id">Course code</label>
    <input id="reactive-course-id" type="text" formControlName="courseId" placeholder="Example: ANG101" />
    <span *ngIf="enrollForm.get('courseId')?.touched && enrollForm.get('courseId')?.errors?.['required']">
      Course code is required.
    </span>
    <span *ngIf="enrollForm.get('courseId')?.errors?.['noCourseCode']">
      Course code starting with XX is not allowed.
    </span>

    <label for="reactive-semester">Preferred semester</label>
    <select id="reactive-semester" formControlName="preferredSemester">
      <option value="Odd">Odd</option>
      <option value="Even">Even</option>
    </select>

    <label class="checkbox-label" for="reactive-terms">
      <input id="reactive-terms" type="checkbox" formControlName="agreeToTerms" />
      I agree to the terms and conditions.
    </label>
    <span *ngIf="enrollForm.get('agreeToTerms')?.touched && enrollForm.get('agreeToTerms')?.errors?.['required']">
      You must agree to the terms.
    </span>

    <div formArrayName="additionalCourses" class="additional-courses">
      <h2>Additional Courses</h2>
      <div *ngFor="let ctrl of additionalCourses.controls; let i = index">
        <input [formControl]="ctrl" placeholder="Additional course code" />
        <button type="button" (click)="removeCourse(i)">Remove</button>
        <span *ngIf="ctrl.touched && ctrl.errors?.['required']">Course code is required.</span>
      </div>
      <button type="button" (click)="addCourse()">Add Another Course</button>
    </div>

    <button type="submit" [disabled]="enrollForm.invalid">Submit</button>
  </form>
</section>
