<div class="enrollment-container">

  <h1>Student Enrollment Request</h1>

  <form
    #enrollForm="ngForm"
    (ngSubmit)="onSubmit(enrollForm)"
  >

    <!-- Student Name -->
    <div class="form-group">
      <label for="studentName">Student Name</label>

      <input
        id="studentName"
        type="text"
        name="studentName"
        [(ngModel)]="studentName"
        required
        minlength="3"
        #nameCtrl="ngModel"
      />

      <div
        class="error"
        *ngIf="nameCtrl.touched && nameCtrl.errors?.['required']"
      >
        Name is required
      </div>

      <div
        class="error"
        *ngIf="nameCtrl.touched && nameCtrl.errors?.['minlength']"
      >
        Name must be at least 3 characters
      </div>
    </div>


    <!-- Student Email -->
    <div class="form-group">
      <label for="studentEmail">Student Email</label>

      <input
        id="studentEmail"
        type="email"
        name="studentEmail"
        [(ngModel)]="studentEmail"
        required
        email
        #emailCtrl="ngModel"
      />

      <div
        class="error"
        *ngIf="emailCtrl.touched && emailCtrl.errors?.['required']"
      >
        Email is required
      </div>

      <div
        class="error"
        *ngIf="emailCtrl.touched && emailCtrl.errors?.['email']"
      >
        Please enter a valid email address
      </div>
    </div>


    <!-- Course ID -->
    <div class="form-group">
      <label for="courseId">Course ID</label>

      <input
        id="courseId"
        type="number"
        name="courseId"
        [(ngModel)]="courseId"
        required
        #courseCtrl="ngModel"
      />

      <div
        class="error"
        *ngIf="courseCtrl.touched && courseCtrl.errors?.['required']"
      >
        Course ID is required
      </div>
    </div>


    <!-- Preferred Semester -->
    <div class="form-group">
      <label for="preferredSemester">Preferred Semester</label>

      <select
        id="preferredSemester"
        name="preferredSemester"
        [(ngModel)]="preferredSemester"
        required
      >
        <option value="Odd">Odd</option>
        <option value="Even">Even</option>
      </select>
    </div>


    <!-- Agree to Terms -->
    <div class="checkbox-group">

      <input
        id="agreeToTerms"
        type="checkbox"
        name="agreeToTerms"
        [(ngModel)]="agreeToTerms"
        required
        #termsCtrl="ngModel"
      />

      <label for="agreeToTerms">
        I agree to the terms and conditions
      </label>

      <div
        class="error"
        *ngIf="termsCtrl.touched && termsCtrl.errors?.['required']"
      >
        You must agree to the terms and conditions
      </div>

    </div>


    <!-- Buttons -->
    <button
      type="submit"
      [disabled]="enrollForm.invalid"
    >
      Submit
    </button>

    <button
      type="button"
      (click)="enrollForm.resetForm()"
    >
      Reset
    </button>

  </form>


  <!-- Success Message -->
  <div
    class="success-message"
    *ngIf="submitted"
  >
    Enrollment request submitted successfully!
  </div>

</div>
